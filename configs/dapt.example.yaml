# Example config — copy to configs/dapt.yaml and set your paths.
# The real configs/dapt.yaml is gitignored (it holds machine-specific paths).
# Domain-adaptive pretraining (DAPT).

model:
  name: Qwen/Qwen3.5-9B-Base        # pilot: Qwen/Qwen3.5-4B-Base
  cache_dir: /path/to/huggingface_cache/hub   # HF hub cache root (the dir holding models--*)

data:
  corpus_dir: /path/to/dapt/shards   # dir of *.jsonl(.gz) shards, one doc/line
  text_field: text                 # field in each shard holding the raw text
  processed_dir: data/processed/dapt
  replay_fraction: 0.15            # replay mix interleaved at a stationary ratio
  replay_dir: HuggingFaceFW/fineweb-edu  # general-text replay: HF hub id or local shard dir
  replay_name: sample-10BT         # HF config name (omit for a local replay_dir)
  replay_text_field: text          # field holding the raw text in replay records
  sequence_length: 4096
  heldout_fraction: 0.01           # corpus slice reserved for perplexity eval
  max_docs: null                   # cap docs tokenised (null = all); set small for smoke runs

train:
  seed: 0
  epochs: 1
  learning_rate: 2.0e-5
  lr_scheduler: cosine
  warmup_ratio: 0.02
  per_device_batch_size: 1
  gradient_accumulation_steps: 32
  gradient_checkpointing: true
  precision: bf16                  # fp8 once Transformer Engine is verified on Blackwell
  optimizer: adamw_8bit
  logging_steps: 10
  save_steps: 500
  max_steps: null                  # cap training steps (null = full epoch); set ~20 for smoke runs

output:
  dir: checkpoints/dapt

eval:
  batch_size: 4                    # held-out perplexity batch size
