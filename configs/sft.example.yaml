# Example config — copy to configs/sft.yaml and set your paths.
# The real configs/sft.yaml is gitignored (it holds machine-specific paths).
# Supervised fine-tuning (SFT) on the grounded QA pairs from the teacher pipeline.

model:
  name: checkpoints/dapt           # base = DAPT output
  cache_dir: /path/to/huggingface_cache

data:
  train_file: /path/to/sft/export/teacher_sft.jsonl  # MUST equal paths.export_file in configs/teacher.yaml
  processed_dir: data/processed/sft
  instruction_replay_fraction: 0.10
  sequence_length: 4096

train:
  epochs: 3
  learning_rate: 1.0e-5
  lr_scheduler: cosine
  warmup_ratio: 0.02
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  precision: bf16

output:
  dir: checkpoints/sft
