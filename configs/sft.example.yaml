# Example config — copy to configs/sft.yaml and set your paths.
# The real configs/sft.yaml is gitignored (it holds machine-specific paths).
# Supervised fine-tuning (SFT) on the grounded QA pairs from the teacher pipeline.

model:
  name: checkpoints/dapt           # base = DAPT output
  cache_dir: /path/to/huggingface_cache

data:
  train_file: /path/to/sft/export/teacher_sft.jsonl  # MUST equal paths.export_file in configs/teacher.yaml
  processed_dir: data/processed/sft
  val_fraction: 0.02               # held-out validation split (by record; export has no provenance)
  instruction_replay_fraction: 0.10
  instruction_replay_dir: null     # general instruction data: HF hub id or local chat JSONL (null = off)
  instruction_replay_name: null    # HF config name (omit for a local instruction_replay_dir)
  sequence_length: 4096

train:
  seed: 0
  epochs: 3
  learning_rate: 1.0e-5
  lr_scheduler: cosine
  warmup_ratio: 0.02
  per_device_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  precision: bf16
  optimizer: adamw_8bit
  logging_steps: 10
  save_steps: 500
  max_steps: null                  # cap training steps (null = full epochs); set ~20 for smoke runs

output:
  dir: checkpoints/sft

eval:
  num_qa_samples: 200              # validation questions greedily answered for the QA probe
  max_new_tokens: 256
