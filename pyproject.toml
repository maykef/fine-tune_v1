[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finetune"
version = "0.0.0"
description = "Fine-tunes Qwen3.5-9B-Base on a microscopy corpus using Transformers + TRL."
requires-python = ">=3.10"
dependencies = [
    "transformers==5.5.0",
    "trl==0.24.0",
    "datasets==4.3.0",
    "accelerate==1.14.0",
    "bitsandbytes==0.49.2",
    "flash-linear-attention==0.5.2",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
